name: build-hmod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install --git https://github.com/ludovic111/horizon cargo-horizon-mod
      - run: |
          cd "$RUNNER_TEMP"
          cargo horizon-mod new jade_lite
          cp "$GITHUB_WORKSPACE/src/lib.rs" jade_lite/src/lib.rs
          cp "$GITHUB_WORKSPACE/src/api.rs" jade_lite/src/api.rs
          cp "$GITHUB_WORKSPACE/horizon-mod.toml" jade_lite/horizon-mod.toml
          cd jade_lite
          cargo horizon-mod build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp target/horizon-mod/jade_lite.hmod "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: jade_lite_hmod
          path: out/jade_lite.hmod
